<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임용고시 교육학 마스터: 교육방법 및 공학 편</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Pretendard', 'sans-serif'] },
                    colors: { primary: '#5A4EE5' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; }
        .glass-panel { background: #ffffff; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); border: 1px solid #f1f5f9; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        
        /* Custom Radio Selection Styles */
        .option-label.selected { background-color: #f0fdf4; border-color: #22c55e; }
        .option-label.selected .option-circle { background-color: #22c55e; color: #ffffff; }
        .option-label.selected span { color: #166534; font-weight: 600; }
        
        .option-label.wrong-selected { background-color: #fff1f2; border-color: #f43f5e; }
        .option-label.wrong-selected .option-circle { background-color: #f43f5e; color: #ffffff; }
        .option-label.wrong-selected span { color: #9f1239; font-weight: 600; }

        .tab-active { background-color: #5A4EE5; color: white; border-color: #5A4EE5; }
        .tab-inactive { background-color: transparent; color: #475569; border-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

    <header class="bg-transparent pt-12 pb-8">
        <div class="max-w-5xl mx-auto px-4 text-center">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-[#201D56] mb-3 tracking-tight">임용고시 교육학 마스터: 교육방법 및 공학 편</h1>
            <p class="text-[#6B7280] mb-8 font-medium">전 범위 핵심 개념 인출 퀴즈 (무작위 셔플 & 논술 모범 문장 제공)</p>
            
            <nav class="flex justify-center flex-wrap gap-2" id="main-tabs">
                <button onclick="setMode('all')" class="tab-btn tab-active px-6 py-2.5 rounded-xl font-bold transition" data-mode="all">전체 모의고사</button>
                <button onclick="setMode('short')" class="tab-btn tab-inactive px-6 py-2.5 rounded-xl font-bold hover:bg-slate-100 transition" data-mode="short">단답형 집중</button>
                <button onclick="setMode('mcq')" class="tab-btn tab-inactive px-6 py-2.5 rounded-xl font-bold hover:bg-slate-100 transition" data-mode="mcq">객관식 집중</button>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 pb-16 w-full">
        
        <div id="start-screen" class="glass-panel p-10 text-center mx-auto mt-2 fade-in">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-[#EEEDFC] text-primary rounded-full mb-6">
                <i class="fa-solid fa-graduation-cap text-4xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-4">학습을 시작할 준비가 되셨나요?</h2>
            <p class="text-slate-600 mb-8 leading-relaxed max-w-lg mx-auto">
                이 모의고사는 2026년 최신 교육 트렌드와 전통적 핵심 이론을 모두 반영하고 있습니다. 새로고침할 때마다 문제와 보기가 무작위로 섞입니다.
            </p>
            <button onclick="startQuiz()" class="bg-primary hover:bg-[#4a3fcc] text-white font-bold py-4 px-10 rounded-xl transition shadow-lg text-lg w-full sm:w-auto">
                <i class="fa-solid fa-play mr-2"></i> 실전 훈련 시작하기
            </button>
        </div>

        <div id="quiz-screen" class="hidden mx-auto fade-in">
            <div class="glass-panel p-6 sm:p-10 mb-6">
                
                <div class="flex justify-between items-center mb-8 pb-4 border-b border-slate-100">
                    <span id="q-type" class="bg-[#EEEDFC] text-primary text-[13px] font-bold px-4 py-1.5 rounded-full">단답형/기입형</span>
                    <div class="text-slate-500 text-sm font-medium">
                        <span id="q-topic" class="mr-3">주제</span>
                        <span id="progress-text" class="font-bold text-[#201D56] text-lg">1 / 50</span>
                    </div>
                </div>
                
                <h3 id="question-text" class="text-[22px] sm:text-2xl font-bold text-slate-800 mb-8 leading-relaxed whitespace-pre-wrap break-keep"></h3>
                
                <div id="input-area" class="w-full mb-8"></div>
                
                <div class="w-full">
                    <button id="submit-btn" onclick="submitAnswer()" class="bg-primary hover:bg-[#4a3fcc] text-white font-bold py-4 px-8 rounded-xl transition shadow-md w-full text-lg">
                        정답 확인
                    </button>
                </div>
            </div>

            <div id="feedback-card" class="hidden flex-col gap-5 mb-10 fade-in">
                
                <div id="result-banner" class="p-5 rounded-xl font-bold text-[17px] flex items-center shadow-sm">
                    <span id="result-icon" class="mr-3 text-2xl"></span>
                    <span id="result-message"></span>
                </div>
                
                <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                    <h5 class="text-[13px] font-bold text-slate-500 mb-3"><i class="fa-solid fa-book-open mr-2"></i>개념 해설</h5>
                    <p id="explanation-text" class="text-slate-700 text-[15px] leading-relaxed whitespace-pre-wrap"></p>
                </div>
                
                <div class="bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl p-6 shadow-sm">
                    <h5 class="text-[13px] font-bold text-[#3B82F6] mb-3"><i class="fa-solid fa-key mr-2 text-amber-400"></i>암기 키워드 & 두문자</h5>
                    <p id="mnemonic-text" class="text-[#1E3A8A] font-bold text-[15px] leading-relaxed"></p>
                </div>
                
                <div class="bg-[#FFF7ED] border border-[#FFEDD5] rounded-xl p-6 shadow-sm">
                    <h5 class="text-[13px] font-bold text-[#EA580C] mb-3"><i class="fa-solid fa-pen-nib mr-2 text-[#EA580C]"></i>실전 논술 (2026 트렌드 연계)</h5>
                    <p id="essay-tip-text" class="text-[#9A3412] font-medium text-[15px] leading-relaxed"></p>
                </div>

                <div class="mt-2" id="next-btn-wrapper">
                    <button id="next-btn" onclick="nextQuestion()" class="bg-primary hover:bg-[#4a3fcc] text-white font-bold py-4 px-8 rounded-xl transition shadow-md w-full text-lg">
                        다음 문제로 이동 (Enter ↵)
                    </button>
                </div>
            </div>
        </div>

        <div id="result-screen" class="hidden glass-panel p-10 text-center mx-auto mt-6 fade-in border-t-4 border-t-primary">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">모의고사 완료!</h2>
            <div class="flex justify-center gap-6 mb-10">
                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 w-36">
                    <p class="text-sm text-slate-500 mb-2">총 문항</p>
                    <p class="text-4xl font-extrabold text-slate-800" id="res-total">0</p>
                </div>
                <div class="bg-[#EEEDFC] p-6 rounded-2xl border border-[#D9D6FE] w-36">
                    <p class="text-sm text-primary mb-2">정답 수</p>
                    <p class="text-4xl font-extrabold text-primary" id="res-correct">0</p>
                </div>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button onclick="startQuiz()" class="bg-[#2563EB] hover:bg-[#1D4ED8] text-white font-bold py-3.5 px-8 rounded-xl transition shadow-md">
                    <i class="fa-solid fa-rotate-right mr-2"></i> 다시 풀기 (셔플)
                </button>
            </div>
        </div>
        
    </main>

    <script>
        const masterQuestions = [
            {
                id: 1, topic: "구성주의 지식관", type: "mcq",
                q: "객관주의(행동주의/인지주의)와 대비되는 구성주의 교육관에 대한 설명으로 옳은 것은?",
                options: [
                    "지식은 절대적이고 불변하며 객관적으로 존재하는 것이다.",
                    "교사는 유일한 정보제공자로서 지식을 가장 효율적으로 전달하는 역할을 한다.",
                    "지식은 주관적이고 유동적이며 개인의 경험을 통해 능동적으로 재구성된다.",
                    "학습 과제는 단순화되고 탈맥락화된 형태로 제시되어야 이해가 빠르다."
                ],
                a: "지식은 주관적이고 유동적이며 개인의 경험을 통해 능동적으로 재구성된다.",
                exp: "구성주의에서 지식은 학습자의 경험에 의해 주관적으로 의미가 부여되고 구성되는 것입니다. 지식은 유동적이며 개인에 의해 계속적으로 재구성된다고 봅니다. 반면, 탈맥락화된 지식은 객관주의의 특징입니다.",
                tip: "교사는 지식을 일방적으로 주입하기보다, 학생들이 실생활 맥락 속에서 스스로 의미를 구성해 나가도록 안내자이자 촉진자 역할을 해야 한다.",
                m: "구성주의 = 주관적, 유동적, 맥락적 지식 구성"
            },
            {
                id: 2, topic: "인지적/사회적 구성주의", type: "short",
                q: "피아제(Piaget)의 이론에 근거하여 지식 구성이 개인의 정신적 활동(동화와 조절)을 통해 이루어진다고 보는 인지적 구성주의와 달리, 비고츠키(Vygotsky)의 이론에 근거하여 사회적 상호작용을 통한 지식의 내면화를 강조하는 구성주의는 무엇인가? (O O O 구성주의)",
                accepted: ["사회적", "사회적구성주의", "사회적 구성주의"],
                a: "사회적 구성주의",
                exp: "비고츠키의 사회적 구성주의는 학습이 사회적으로 맥락화된 지식을 학습자가 내면화하는 과정이라고 보며, 동료나 주변 인물들과의 상호작용 및 스캐폴딩(비계)을 강조합니다.",
                tip: "학생들의 능동적인 지식 구성을 위해, 교사는 개인의 인지적 발달뿐만 아니라 동료 학습자와의 활발한 상호작용(사회적 구성주의)을 촉진하는 협동학습 환경을 조성해야 한다.",
                m: "피아제 = 인지적 (개인) / 비고츠키 = 사회적 (상호작용, 스캐폴딩)"
            },
            {
                id: 3, topic: "통신과정 모형(SMCR)", type: "mcq",
                q: "벌로(Berlo)의 SMCR 모형에서 '통신기술, 태도, 지식수준, 사회체계, 문화양식'에 의해 공통적으로 영향을 받는 두 가지 요소로 바르게 짝지어진 것은?",
                options: [
                    "송신자(Sender)와 메시지(Message)",
                    "송신자(Sender)와 수신자(Receiver)",
                    "메시지(Message)와 통신방법(Channel)",
                    "통신방법(Channel)과 수신자(Receiver)"
                ],
                a: "송신자(Sender)와 수신자(Receiver)",
                exp: "벌로의 모형에 따르면 메시지를 전달하는 송신자(교사)와 이를 받아들이는 수신자(학생)는 모두 통신기술, 태도, 지식수준, 사회체제, 문화양식의 영향을 받습니다. 이들의 유사성이 높을수록 통신(수업)이 효과적입니다.",
                tip: "교사는 자신과 학생의 지식수준 및 문화양식의 차이를 이해하고, 이를 좁히기 위해 학생의 '경험의 장'에 맞는 적절한 메시지 코드와 통신방법을 선택해야 한다.",
                m: "S(송신자)와 R(수신자)는 동일한 5가지 영향(통,태,지,사,문)을 받음"
            },
            {
                id: 4, topic: "섀넌과 슈람 통신모형", type: "short",
                q: "섀넌과 슈람(Shannon & Schramm)의 통신모형에서 송신자가 의도한 메시지가 수신자에게 다르게 전달되게 만드는 물리적, 심리적 방해요소를 무엇이라고 하는가? (2글자)",

                tip: "수업 중 발생할 수 있는 심리적, 환경적 '잡음'을 최소화하기 위해 교사는 학생의 반응을 살피고 즉각적인 피드백을 주고받아야 한다.",
                m: "통신 방해요소 = 잡음 / 해결책 = 경험의 장 확대, 피드백"
            },
            {
                id: 5, topic: "블룸 신교육목표분류학", type: "mcq",
                q: "2001년 개정된 블룸(Bloom)의 신교육목표분류학에 대한 설명으로 틀린 것은?",
                options: [
                    "인지과정 차원을 명사형이 아닌 동사형으로 제시하였다.",
                    "기존의 '지식' 영역을 인지과정에서 분리하여 독립된 '지식 차원'으로 신설하였다.",
                    "가장 복잡한 고차원적 인지과정으로 '평가하다'를 최상위에 두었다.",
                    "지식 차원은 사실적, 개념적, 절차적, 메타인지 지식으로 세분화되었다."
                ],
                a: "가장 복잡한 고차원적 인지과정으로 '평가하다'를 최상위에 두었다.",
                exp: "신교육목표분류학에서는 기존의 '종합'과 '평가'의 위계를 바꾸어, 가장 고차원적인 인지과정을 '창안하다(Create)'로 변경하여 최상위에 두었습니다.",
                tip: "단순한 사실적 지식의 암기를 넘어, 학생 스스로 지식을 종합하여 새로운 아이디어를 '창안(Create)'할 수 있도록 고차원적 사고를 요구하는 평가를 설계해야 한다.",
                m: "신블룸 최상위 = 창안하다 (평가와 종합의 위계 변경)"

                q: "메이거(Mager)의 수업목표 진술 방식에서 목표가 명확하게 설정되기 위해 반드시 포함되어야 하는 3가지 요건은 '도착점 행동', '상황(조건)', 그리고 도달 여부를 판별하는 기준인 'OO'이다. 빈칸은?",
                accepted: ["준거", "도달기준", "기준"],
                a: "준거",
                exp: "메이거의 조작적 수업목표 진술의 3요소는 상황(조건), 준거(수락기준), 도착점 행동입니다. 예: '100m 트랙에서(상황) 15초 이내에(준거) 달릴 수 있다(도착점 행동)'.",

            {

                options: [

        // 암호학적 난수 생성기를 활용한 무작위 정수 반환
        function getRandomInt(max) {
            if (window.crypto && window.crypto.getRandomValues) {
                const array = new Uint32Array(1);
                window.crypto.getRandomValues(array);
                return array[0] % max;
            }
            return Math.floor(Math.random() * max);
        }

        // 원본 배열을 훼손하지 않는 Fisher-Yates 무작위 셔플
        function shuffleArray(array) {
            const copy = [...array];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = getRandomInt(i + 1);
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // 객관식 보기가 원래 순서 및 직전 순서와 겹치지 않도록 보장하는 셔플
        function shuffleOptions(question) {
            const originalKey = question.options.join('||');
            const prevKey = question._lastOptionOrder || '';
            let shuffled = shuffleArray(question.options);
            let attempts = 0;

            while (
                question.options.length > 1 &&
                (shuffled.join('||') === originalKey || shuffled.join('||') === prevKey) &&
                attempts < 15
            ) {
                shuffled = shuffleArray(question.options);
                attempts++;
            }

            question._lastOptionOrder = shuffled.join('||');
            return shuffled;
        }

        function normalizeString(str) {
            return str.replace(/[\s\-_,.()]/g, '').toLowerCase();
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.mode === mode) {
                    btn.classList.remove('tab-inactive');
                    btn.classList.add('tab-active');
                } else {
                    btn.classList.remove('tab-active');
                    btn.classList.add('tab-inactive');
                }
            });
            startQuiz();
        }

        function startQuiz() {
            let pool = [];
            switch (currentMode) {
                case 'all': pool = [...masterQuestions]; break;
                case 'short': pool = masterQuestions.filter(q => q.type === 'short'); break;
                case 'mcq': pool = masterQuestions.filter(q => q.type === 'mcq'); break;
            }

            if (pool.length === 0) return;

            activeQuestions = shuffleArray(pool);
            currentIndex = 0;
            score = 0;
            
            DOM.startScreen.classList.add('hidden');
            DOM.resultScreen.classList.add('hidden');
            DOM.quizScreen.classList.remove('hidden');
            
            renderQuestion();
        }

        function renderQuestion() {
            isAnswerSubmitted = false;
            DOM.feedbackCard.classList.add('hidden');
            DOM.feedbackCard.classList.remove('flex');
            DOM.submitBtn.classList.remove('hidden');
            DOM.nextBtnWrapper.classList.add('hidden');
            DOM.quizScreen.classList.remove('shake');
            
            const q = activeQuestions[currentIndex];
            
            DOM.progressText.textContent = `${currentIndex + 1} / ${activeQuestions.length}`;
            DOM.qTopic.textContent = q.topic;
            DOM.qType.textContent = q.type === 'mcq' ? '객관식 판별' : '단답형/기입형';
            
            DOM.qText.textContent = q.q;
            DOM.inputArea.innerHTML = '';
            
            if (q.type === 'mcq') {
                const shuffledOptions = shuffleOptions(q);
                const optsContainer = document.createElement('div');
                optsContainer.className = 'flex flex-col gap-3.5';

                shuffledOptions.forEach((opt, index) => {
                    const label = document.createElement('label');
                    label.className = 'option-label flex items-center p-4 sm:p-5 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition select-none';

                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = 'answer';
                    radio.value = opt;
                    radio.className = 'hidden';

                    const circle = document.createElement('div');
                    circle.className = 'w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold mr-4 flex-shrink-0 option-circle transition-colors';
                    circle.textContent = index + 1;

                    const textSpan = document.createElement('span');
                    textSpan.className = 'text-slate-700 leading-relaxed font-medium text-[17px] transition-colors';
                    textSpan.textContent = opt;

                    label.appendChild(radio);
                    label.appendChild(circle);
                    label.appendChild(textSpan);

                    label.addEventListener('click', function() {
                        if (isAnswerSubmitted) return;
                        radio.checked = true;
                        document.querySelectorAll('.option-label').forEach(l => {
                            l.classList.remove('ring-2', 'ring-primary', 'border-primary', 'bg-[#EEEDFC]');
                            const c = l.querySelector('.option-circle');
                            c.classList.remove('bg-primary', 'text-white');
                            c.classList.add('bg-slate-100', 'text-slate-500');
                        });
                        this.classList.add('ring-2', 'ring-primary', 'border-primary', 'bg-[#EEEDFC]');
                        circle.classList.remove('bg-slate-100', 'text-slate-500');
                        circle.classList.add('bg-primary', 'text-white');
                    });

                    optsContainer.appendChild(label);
                });

                DOM.inputArea.appendChild(optsContainer);
            } else {
                DOM.inputArea.innerHTML = `
                    <input type="text" id="short-answer-input" autocomplete="off" placeholder="정답을 입력하세요 (엔터키로 즉시 채점)" 
                           class="w-full text-[17px] p-5 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-[#D9D6FE] transition font-medium text-slate-800">
                `;
                setTimeout(() => {
                    const inputEl = document.getElementById('short-answer-input');
                    if (!inputEl) return;
                    inputEl.focus();
                    inputEl.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            e.stopPropagation();
                            if (isAnswerSubmitted) nextQuestion();
                            else submitAnswer();
                        }
                    });
                }, 50);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && isAnswerSubmitted && !DOM.quizScreen.classList.contains('hidden')) {
                e.preventDefault();
                nextQuestion();
            }
        });

        function submitAnswer() {
            if (isAnswerSubmitted) return;
            const q = activeQuestions[currentIndex];
            let isCorrect = false;
            let userAnswer = '';

            if (q.type === 'mcq') {
                const selected = document.querySelector('input[name="answer"]:checked');
                if (!selected) {
                    DOM.quizScreen.classList.remove('shake');
                    void DOM.quizScreen.offsetWidth; 
                    DOM.quizScreen.classList.add('shake');
                    return;
                }
                userAnswer = selected.value;
                isCorrect = (userAnswer === q.a);
                
                document.querySelectorAll('input[name="answer"]').forEach(radio => {
                    const label = radio.closest('label');
                    const circle = label.querySelector('.option-circle');
                    radio.disabled = true;
                    label.classList.remove('ring-2', 'ring-primary', 'border-primary', 'bg-[#EEEDFC]', 'hover:bg-slate-50');
                    label.classList.add('cursor-default');
                    circle.classList.remove('bg-primary', 'text-white');
                    circle.classList.add('bg-slate-100', 'text-slate-500');
                    
                    if (radio.value === q.a) {
                        label.classList.add('selected');
                    } else if (radio.checked && !isCorrect) {
                        label.classList.add('wrong-selected');
                    }
                });

            } else {
                const inputEl = document.getElementById('short-answer-input');
                userAnswer = inputEl.value.trim();
                if (!userAnswer) {
                    DOM.quizScreen.classList.remove('shake');
                    void DOM.quizScreen.offsetWidth;
                    DOM.quizScreen.classList.add('shake');
                    return;
                }
                inputEl.disabled = true;
                const normalizedUser = normalizeString(userAnswer);
                isCorrect = q.accepted.some(acc => normalizeString(acc) === normalizedUser);
                
                if (isCorrect) {
                    inputEl.classList.remove('border-slate-200', 'focus:border-primary');
                    inputEl.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900', 'font-bold');
                } else {
                    inputEl.classList.remove('border-slate-200', 'focus:border-primary');
                    inputEl.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-900', 'font-bold');
                }
            }

            isAnswerSubmitted = true;
            DOM.submitBtn.classList.add('hidden');
            DOM.nextBtnWrapper.classList.remove('hidden');

            if (isCorrect) {
                score++;
            }
            showFeedback(isCorrect, q);
        }

        function showFeedback(isCorrect, q) {
            DOM.feedbackCard.classList.remove('hidden');
            DOM.feedbackCard.classList.add('flex');
            
            if (isCorrect) {
                DOM.resultBanner.className = "p-5 rounded-xl font-bold text-lg flex items-center shadow-sm bg-[#F0FDF4] text-[#15803D] border border-[#DCFCE7]";
                DOM.resultIcon.innerHTML = "🎉";
                DOM.resultMessage.innerHTML = `정답입니다! 공식 정답은 <span class="mx-1 px-2 py-0.5 bg-[#BBF7D0] rounded">[ ${q.a} ]</span> 입니다.`;
            } else {
                DOM.resultBanner.className = "p-5 rounded-xl font-bold text-lg flex items-center shadow-sm bg-[#FEF2F2] text-[#B91C1C] border border-[#FEE2E2]";
                DOM.resultIcon.innerHTML = "💡";
                DOM.resultMessage.innerHTML = `아쉽습니다. 공식 정답은 <span class="mx-1 px-2 py-0.5 bg-[#FECACA] rounded">[ ${q.a} ]</span> 입니다.`;
            }

            DOM.explanationText.textContent = q.exp;
            DOM.essayTipText.textContent = q.tip;
            DOM.mnemonicText.textContent = q.m;
            
            setTimeout(() => {
                DOM.feedbackCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < activeQuestions.length) {
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                showResults();
            }
        }

        function showResults() {
            DOM.quizScreen.classList.add('hidden');
            DOM.resultScreen.classList.remove('hidden');
            
            document.getElementById('res-total').textContent = activeQuestions.length;
            document.getElementById('res-correct').textContent = score;
        }
    </script>
</body>
</html>
