<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교육방법 및 공학 마스터 (2026 에듀테크 트렌드)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-panel { background: #ffffff; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); border: 1px solid #f1f5f9; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Custom Radio Selection Styles */
        .option-label.selected { background-color: #f0fdf4; border-color: #22c55e; }
        .option-label.selected .option-circle { background-color: #22c55e; color: #ffffff; }
        .option-label.selected span { color: #166534; font-weight: 600; }
        
        .option-label.wrong-selected { background-color: #fff1f2; border-color: #f43f5e; }
        .option-label.wrong-selected .option-circle { background-color: #f43f5e; color: #ffffff; }
        .option-label.wrong-selected span { color: #9f1239; font-weight: 600; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-transparent pt-10 pb-6">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-indigo-900 mb-3 tracking-tight">SANTA 파이널: 교육방법 및 공학 (2026 트렌드 완벽대비)</h1>
            <p class="text-slate-500 mb-8 font-medium">전 범위 핵심 개념 인출 퀴즈 (무작위 셔플 & 오답노트 & 논술 모범 문장 제공)</p>
            
            <nav class="flex justify-center flex-wrap gap-2 sm:gap-6" id="main-tabs">
                <button onclick="setMode('all')" class="tab-btn px-6 py-2.5 rounded-full font-bold bg-indigo-600 text-white shadow-md transition" data-mode="all">전체 모의고사</button>
                <button onclick="setMode('short')" class="tab-btn px-6 py-2.5 rounded-full font-bold text-slate-500 hover:bg-slate-100 transition" data-mode="short">단답형 집중</button>
                <button onclick="setMode('mcq')" class="tab-btn px-6 py-2.5 rounded-full font-bold text-slate-500 hover:bg-slate-100 transition" data-mode="mcq">객관식 집중</button>
                <button onclick="setMode('incorrect')" class="tab-btn px-6 py-2.5 rounded-full font-bold text-slate-500 hover:bg-slate-100 transition relative" data-mode="incorrect">
                    오답 노트 
                    <span id="incorrect-badge" class="absolute -top-1 -right-2 bg-pink-500 text-white text-xs px-2 py-0.5 rounded-full hidden shadow">0</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pb-12 w-full">
        
        <div id="start-screen" class="glass-panel p-10 text-center mx-auto mt-6 fade-in">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full mb-6">
                <i class="fa-solid fa-graduation-cap text-4xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-4">학습을 시작할 준비가 되셨나요?</h2>
            <p class="text-slate-600 mb-8 leading-relaxed max-w-lg mx-auto">
                이 모의고사는 2026년 최신 교육 트렌드와 전통적 핵심 이론을 모두 반영하고 있습니다. 실제 시험과 동일한 감각으로 훈련해 보세요.
            </p>
            <button onclick="startQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-10 rounded-xl transition shadow-lg text-lg w-full sm:w-auto">
                <i class="fa-solid fa-play mr-2"></i> 실전 훈련 시작하기
            </button>
        </div>

        <div id="quiz-screen" class="hidden mx-auto fade-in">
            <div class="glass-panel p-6 sm:p-10 mb-6">
                
                <div class="flex justify-between items-center mb-8 border-b border-slate-100 pb-4">
                    <span id="q-type" class="bg-indigo-50 text-indigo-600 text-sm font-bold px-4 py-1.5 rounded-full">단답형/기입형</span>
                    <div class="text-slate-500 text-sm font-medium">
                        <span id="q-topic" class="mr-2">주제</span>
                        <span id="progress-text" class="font-bold text-indigo-900 text-lg">1 / 60</span>
                    </div>
                </div>
                
                <h3 id="question-text" class="text-xl sm:text-2xl font-bold text-slate-800 mb-8 leading-relaxed whitespace-pre-wrap"></h3>
                
                <div id="input-area" class="w-full mb-8"></div>
                
                <div class="w-full">
                    <button id="submit-btn" onclick="submitAnswer()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded-xl transition shadow-md w-full text-lg">
                        정답 확인
                    </button>
                </div>
            </div>

            <!-- 해설 및 피드백 영역 분리 -->
            <div id="feedback-card" class="hidden flex-col gap-4 mb-10 fade-in">
                
                <!-- 정답 결과 배너 -->
                <div id="result-banner" class="p-5 rounded-xl font-bold text-lg flex items-center shadow-sm">
                    <span id="result-icon" class="mr-3 text-2xl"></span>
                    <span id="result-message"></span>
                </div>
                
                <!-- 개념 해설 -->
                <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                    <h5 class="text-sm font-bold text-slate-500 mb-3"><i class="fa-solid fa-book-open mr-2"></i>개념 해설</h5>
                    <p id="explanation-text" class="text-slate-700 text-[15px] leading-relaxed whitespace-pre-wrap"></p>
                </div>
                
                <!-- 암기 키워드 -->
                <div class="bg-[#f8fafc] border border-blue-100 rounded-xl p-6 shadow-sm">
                    <h5 class="text-sm font-bold text-blue-500 mb-3"><i class="fa-solid fa-key mr-2 text-amber-400"></i>암기 키워드 & 두문자</h5>
                    <p id="mnemonic-text" class="text-indigo-900 font-bold text-[15px] leading-relaxed"></p>
                </div>
                
                <!-- 실전 논술 -->
                <div class="bg-orange-50/50 border border-orange-100 rounded-xl p-6 shadow-sm">
                    <h5 class="text-sm font-bold text-orange-500 mb-3"><i class="fa-solid fa-pen-nib mr-2"></i>실전 논술 (2026 트렌드 연계)</h5>
                    <p id="essay-tip-text" class="text-orange-900 font-medium text-[15px] leading-relaxed"></p>
                </div>

                <div class="mt-4">
                    <button id="next-btn" onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded-xl transition shadow-md w-full text-lg">
                        다음 문제로 이동 (Enter ↵)
                    </button>
                </div>
            </div>
        </div>

        <div id="result-screen" class="hidden glass-panel p-10 text-center mx-auto mt-6 fade-in border-t-4 border-t-indigo-500">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <p class="text-sm text-slate-500 mb-1">총 문항</p>
                    <p class="text-3xl font-bold text-slate-800" id="res-total">0</p>
                </div>
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-200">
                    <p class="text-sm text-blue-600 mb-1">정답 수</p>
                    <p class="text-3xl font-bold text-blue-700" id="res-correct">0</p>
                </div>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button onclick="startQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-xl transition shadow-md">
                    <i class="fa-solid fa-rotate-right mr-2"></i> 다시 풀기 (셔플)
                </button>
                <button onclick="setMode('incorrect')" class="bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold py-3.5 px-6 rounded-xl border border-rose-200 transition shadow-md">
                    <i class="fa-solid fa-book-journal-whills mr-2"></i> 오답 노트 복습
                </button>
            </div>
        </div>
        
    </main>

    <script>
        // 2026년 교육 현안 및 전통적 필수 핵심 개념을 망라한 65문항 마스터 문제 은행
        const masterQuestions = [
            // --- 1. 최신 에듀테크 & 트렌드 ---
            {
                id: 101, topic: "AI 디지털 교과서", type: "mcq",
                q: "2026년 본격 도입되는 AI 디지털 교과서와 기존 서책형 교과서의 차이점으로 가장 거리가 먼 것은?",
                options: [
                    "AI 교과서는 학생의 학습 진도, 성취 수준, 학습 특성 등 방대한 데이터를 실시간으로 수집하고 분석한다.",
                    "서책형 교과서는 지식 전달 위주의 단방향 학습을 이끌지만, AI 교과서는 교사-학생-컴퓨터 간 다방향 학습을 촉진한다.",
                    "AI 교과서는 교과 간 서로 단절된 개별 학습을 심화시켜 특정 과목에 대한 전문성을 극도로 높이는 데 주력한다.",
                    "서책형 교과서는 자료가 고정되어 변환이 어렵지만, AI 교과서는 새로운 사실과 지식을 신속하게 반영(업데이트)할 수 있다."
                ],
                a: "AI 교과서는 교과 간 서로 단절된 개별 학습을 심화시켜 특정 과목에 대한 전문성을 극도로 높이는 데 주력한다.",
                exp: "AI 디지털 교과서는 오히려 교과 내/교과 간 연계 학습을 강화하고 하이퍼링크 및 다양한 DB와의 연계를 통해 융합적 사고력을 높이는 방향으로 활용됩니다.",
                tip: "교사는 AI 디지털 교과서의 '학습 데이터 분석 기능'을 활용하여 학생 개개인의 성취 수준을 실시간으로 진단하고, 이에 기반한 맞춤형 처방을 제공함으로써 개별화 교육을 실현해야 한다.",
                m: "AI 디지털 교과서 = 맞춤형 진단 + 다방향 연계 + 지속적 업데이트"
            },
            {
                id: 102, topic: "인공지능 기반 교육", type: "short",
                q: "AI 챗봇(예: 챗GPT)을 활용한 교육은 언제 어디서나 개별 맞춤 학습과 언어 학습 지원이 가능하다는 장점이 있다. 그러나 기계에 대한 지나친 의존성 문제와 함께, 인간 대 인간의 정서적 교감이나 공감이 결여될 수 있다는 한계를 지닌다. 이러한 한계를 보완하기 위해 블렌디드 러닝 등을 통해 강화해야 하는 것은 '사회적 OOOO'이다. 4글자는?",
                accepted: ["상호작용"],
                a: "상호작용",
                exp: "인공지능 교육의 가장 큰 단점은 사람 간의 정서적, 사회적 상호작용이 부족하다는 것입니다. 따라서 오프라인에서 교사와 동료 학습자 간의 면대면 상호작용이 필수적으로 병행되어야 합니다.",
                tip: "AI 튜터가 지식의 전달과 반복 학습을 담당하더라도, 교사는 오프라인 교실에서 토론과 협동학습을 주도하며 기계가 대체할 수 없는 '사회적 상호작용'과 정서적 교감을 강화해야 한다.",
                m: "AI 한계 = 사회적 상호작용 부족"
            },
            {
                id: 103, topic: "디지털 리터러시", type: "mcq",
                q: "2022 개정 교육과정에서 매우 강조하는 '디지털 리터러시(지식정보처리역량)' 함양을 위한 교육적 접근으로 적절하지 않은 것은?",
                options: [
                    "컴퓨터를 통해 찾아낸 정보의 진위를 비판적으로 분석하고 평가하는 훈련을 강화한다.",
                    "정보 교과 시간에 한정하여 도구(SW) 사용법 위주로 집중 교육하고, 타 교과와는 분리하여 가르친다.",
                    "다양한 출처의 정보를 조합하여 자신의 목적에 맞는 새로운 정보와 산출물을 창조하도록 유도한다.",
                    "교사들의 디지털 수업 설계 지원을 위한 관련 전문 인력(코디네이터) 및 자원 관리 체제를 구축한다."
                ],
                a: "정보 교과 시간에 한정하여 도구(SW) 사용법 위주로 집중 교육하고, 타 교과와는 분리하여 가르친다.",
                exp: "디지털 리터러시는 단순한 기기 조작(도구 사용법)을 넘어 교과, 비교과, 평생교육 등 광범위한 영역에 통합적으로 적용되어야 하는 핵심 역량입니다.",
                tip: "학생들이 정보의 바다에서 가짜 뉴스를 분별하고 유의미한 지식을 생산해 내도록, 교사는 모든 교과 수업에 '디지털 리터러시(지식정보처리역량)' 교육을 융합하여 비판적 사고력을 길러주어야 한다.",
                m: "디지털 리터러시 = 비판적 수용 + 창조적 생산 (범교과적 역량)"
            },
            {
                id: 104, topic: "마이크로러닝", type: "short",
                q: "학생들의 집중력 유지 시간이 짧아지는 최근 트렌드를 반영하여, 1~2가지의 핵심 개념만을 담아 2~7분 내외로 짧게 소비할 수 있도록 쪼개어 만든 동영상 등의 학습 콘텐츠를 활용하는 교육 방법을 무엇이라고 하는가? (6글자)",
                accepted: ["마이크로러닝", "microlearning"],
                a: "마이크로러닝 (Micro-learning)",
                exp: "마이크로러닝은 짧고 굵은(bite-sized) 콘텐츠를 제공하여 인지부하를 줄이고 시공간의 제약 없이 모바일 기기 등을 통해 자기주도적으로 학습하게 하는 방식입니다.",
                tip: "플립러닝을 위한 사전 학습 영상 제작 시, 교사는 40분짜리 긴 강의보다는 핵심 개념을 분절화한 '마이크로러닝' 형태의 짧은 영상을 제공하여 학생들의 인지적 과부하를 막고 학습 동기를 높여야 한다.",
                m: "2~7분 짧은 핵심 콘텐츠 = 마이크로러닝"
            },
            {
                id: 105, topic: "실감미디어", type: "short",
                q: "우주 탐사나 역사적 현장 체험처럼 물리적으로 접근이 불가능하거나 위험한 상황을 교실에서 안전하게 체험할 수 있도록, 가상현실(VR)이나 증강현실(AR)을 활용하여 사용자의 실재감과 몰입감을 최대로 높이는 기술을 통칭하여 'OO 미디어'라고 한다. 빈칸은?",
                accepted: ["실감", "실감형"],
                a: "실감 미디어",
                exp: "실감미디어는 학습자에게 높은 현장감(실재감)을 주어 오감을 통한 체험 중심 학습을 가능하게 합니다.",
                tip: "위험하거나 접근이 어려운 과학 원리를 가르칠 때, 교사는 VR/AR 등 '실감 미디어'를 활용하여 학습자의 몰입감을 높여야 한다.",
                m: "VR, AR, 실재감 = 실감미디어"
            },
            {
                id: 106, topic: "거꾸로 학습(Flipped Learning)", type: "mcq",
                q: "거꾸로 학습(플립러닝) 도입 시 교사의 역할 및 설계 고려사항으로 가장 거리가 먼 것은?",
                options: [
                    "오프라인 교실 수업 시간을 교사의 주입식 강의가 아닌 고차원적 문제해결과 토론 시간으로 전환한다.",
                    "학생들이 온라인 사전 학습을 해오지 않을 것에 대비하여, 교실 수업 도입부에서 20분 이상 사전 학습 내용을 다시 처음부터 끝까지 재강의한다.",
                    "교육학적 소양뿐만 아니라 테크놀로지 활용에 대한 전문성을 갖추어야 한다.",

                exp: "e-러닝/블렌디드 러닝은 소단위 분절, 즉각적 피드백, 완전학습 시스템 구현이 중요합니다. 기법보다는 내용 중심으로 설계해야 합니다.",
                tip: "온라인 코스웨어 설계 시 전체 과제를 소단위(모듈)로 나누어 제공하고, 퀴즈 통과 시 다음 단계로 넘어가는 '완전학습' 시스템을 구축해야 한다.",
                m: "e러닝 설계 = 소단위 + 즉각 평가 + 완전학습지향"
            },
            {
                id: 170, topic: "교수방법 비교 (학습자 중심 vs 교사 중심)", type: "short",
                q: "학습자 중심의 구성주의 교육에서는 지식 습득의 결과물만을 암기했는지 묻는 규준지향평가(상대평가)를 지양하고, 실제적 과제 수행 능력과 문제해결능력을 갖추었는가를 확인하기 위해 성취 기준 도달 여부를 확인하는 'OOOO평가'(4글자) 혹은 수행평가를 지향한다. 빈칸은?",
                accepted: ["목표지향", "절대평가", "준거지향"],
                a: "목표지향평가 (준거지향평가)",
                exp: "교사 중심은 규준지향평가(서열), 학습자 중심은 목표지향평가(성취) 및 다면적 수행평가를 지향합니다.",
                tip: "학생들의 능동적인 역량 발달을 확인하기 위해, 획일적인 상대평가를 벗어나 학생 개인의 실질적 과제 수행 능력을 점검하는 '수행평가'와 '목표지향평가'를 확대해야 한다.",
                m: "구성주의 평가 = 목표지향, 수행평가, 포트폴리오"
            }
        ];
        
        let currentMode = 'all';
        let activeQuestions = [];
        let currentIndex = 0;
        let incorrectQuestions = JSON.parse(localStorage.getItem('santaTrendsIncorrect')) || [];
        let score = 0;
        let isAnswerSubmitted = false;

        const DOM = {
            startScreen: document.getElementById('start-screen'),
            quizScreen: document.getElementById('quiz-screen'),
            resultScreen: document.getElementById('result-screen'),
            qTopic: document.getElementById('q-topic'),
            qType: document.getElementById('q-type'),
            qText: document.getElementById('question-text'),
            inputArea: document.getElementById('input-area'),
            submitBtn: document.getElementById('submit-btn'),
            nextBtn: document.getElementById('next-btn'),
            feedbackCard: document.getElementById('feedback-card'),
            resultBanner: document.getElementById('result-banner'),
            resultIcon: document.getElementById('result-icon'),
            resultMessage: document.getElementById('result-message'),
            explanationText: document.getElementById('explanation-text'),
            essayTipText: document.getElementById('essay-tip-text'),
            mnemonicText: document.getElementById('mnemonic-text'),
            progressText: document.getElementById('progress-text'),
            incorrectBadge: document.getElementById('incorrect-badge')
        };

        function shuffleArray(array) {
            let curId = array.length, temp, randomId;
            while (0 !== curId) {
                randomId = Math.floor(Math.random() * curId);
                curId -= 1;
                temp = array[curId];
                array[curId] = array[randomId];
                array[randomId] = temp;
            }
            return array;
        }

        function normalizeString(str) {
            return str.replace(/[\s\-_,.]/g, '').toLowerCase();
        }

        function updateIncorrectBadge() {
            if (incorrectQuestions.length > 0) {
                DOM.incorrectBadge.textContent = incorrectQuestions.length;
                DOM.incorrectBadge.classList.remove('hidden');
            } else {
                DOM.incorrectBadge.classList.add('hidden');
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.dataset.mode === mode) {
                    btn.className = "tab-btn px-6 py-2.5 rounded-full font-bold bg-indigo-600 text-white shadow-md transition";
                } else {
                    btn.className = "tab-btn px-6 py-2.5 rounded-full font-bold text-slate-500 hover:bg-slate-100 transition relative";
                }
            });
            startQuiz();
        }

        function startQuiz() {
            let pool = [];
            switch(currentMode) {
                case 'all': pool = [...masterQuestions]; break;
                case 'short': pool = masterQuestions.filter(q => q.type === 'short'); break;
                case 'mcq': pool = masterQuestions.filter(q => q.type === 'mcq'); break;
                case 'incorrect':
                    if(incorrectQuestions.length === 0) {
                        alert("오답 노트가 비어 있습니다. 전체 트렌드 모의고사를 시작합니다.");
                        setMode('all');
                        return;
                    }
                    pool = masterQuestions.filter(q => incorrectQuestions.includes(q.id));
                    break;
            }

            if(pool.length === 0) return;

            activeQuestions = shuffleArray(pool);
            currentIndex = 0;
            score = 0;
            
            DOM.startScreen.classList.add('hidden');
            DOM.resultScreen.classList.add('hidden');
            DOM.quizScreen.classList.remove('hidden');
            
            updateIncorrectBadge();
            renderQuestion();
        }

        function renderQuestion() {
            isAnswerSubmitted = false;
            DOM.feedbackCard.classList.add('hidden');
            DOM.feedbackCard.classList.remove('flex');
            DOM.submitBtn.classList.remove('hidden');
            DOM.nextBtn.parentElement.classList.add('hidden'); // wrap nextBtn in a div in HTML if needed, handled via parent logic or directly
            DOM.quizScreen.classList.remove('shake');
            
            const q = activeQuestions[currentIndex];
            
            DOM.progressText.textContent = `${currentIndex + 1} / ${activeQuestions.length}`;
            DOM.qTopic.textContent = q.topic;
            DOM.qType.textContent = q.type === 'mcq' ? '객관식 판별' : '단답형/기입형';
            
            DOM.qText.textContent = q.q;
            DOM.inputArea.innerHTML = '';
            
            if (q.type === 'mcq') {
                const shuffledOptions = shuffleArray([...q.options]);
                const optsContainer = document.createElement('div');
                optsContainer.className = "flex flex-col gap-3";
                
                shuffledOptions.forEach((opt, index) => {
                    const label = document.createElement('label');
                    label.className = "flex items-center p-4 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition option-label";
                    label.innerHTML = `
                        <input type="radio" name="answer" value="${opt.replace(/"/g, '&quot;')}" class="hidden">
                        <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold mr-4 flex-shrink-0 option-circle transition-colors">${index + 1}</div>
                        <span class="text-slate-700 leading-relaxed font-medium text-[17px] transition-colors">${opt}</span>
                    `;
                    
                    // Click effect for unsubmitted state
                    label.addEventListener('click', function() {
                        if(isAnswerSubmitted) return;
                        document.querySelectorAll('.option-label').forEach(l => {
                            l.classList.remove('ring-2', 'ring-indigo-500', 'border-indigo-500', 'bg-indigo-50/50');
                            l.querySelector('.option-circle').classList.replace('bg-indigo-600', 'bg-slate-100');
                            l.querySelector('.option-circle').classList.replace('text-white', 'text-slate-500');
                        });
                        this.classList.add('ring-2', 'ring-indigo-500', 'border-indigo-500', 'bg-indigo-50/50');
                        this.querySelector('.option-circle').classList.replace('bg-slate-100', 'bg-indigo-600');
                        this.querySelector('.option-circle').classList.replace('text-slate-500', 'text-white');
                    });

                    optsContainer.appendChild(label);
                });
                DOM.inputArea.appendChild(optsContainer);
            } else {
                DOM.inputArea.innerHTML = `
                    <input type="text" id="short-answer-input" autocomplete="off" placeholder="정답을 입력하세요 (엔터키로 즉시 채점)" 
                           class="w-full text-lg p-5 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition">
                `;
                setTimeout(() => {
                    const inputEl = document.getElementById('short-answer-input');
                    inputEl.focus();
                    inputEl.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            if(isAnswerSubmitted) nextQuestion();
                            else submitAnswer();
                        }
                    });
                }, 50);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && isAnswerSubmitted && !DOM.quizScreen.classList.contains('hidden')) {
                nextQuestion();
            }
        });

        function submitAnswer() {
            if(isAnswerSubmitted) return;
            const q = activeQuestions[currentIndex];
            let isCorrect = false;
            let userAnswer = '';

            if (q.type === 'mcq') {
                const selected = document.querySelector('input[name="answer"]:checked');
                if (!selected) {
                    DOM.quizScreen.classList.remove('shake');
                    void DOM.quizScreen.offsetWidth; 
                    DOM.quizScreen.classList.add('shake');
                    return;
                }
                userAnswer = selected.value;
                isCorrect = (userAnswer === q.a);
                
                document.querySelectorAll('input[name="answer"]').forEach(radio => {
                    const label = radio.closest('label');
                    radio.disabled = true;
                    // Reset selection styles
                    label.classList.remove('ring-2', 'ring-indigo-500', 'border-indigo-500', 'bg-indigo-50/50', 'hover:bg-slate-50');
                    label.classList.add('cursor-default');
                    
                    if(radio.value === q.a) {
                        label.classList.add('selected');
                    } else if (radio.checked && !isCorrect) {
                        label.classList.add('wrong-selected');
                    }
                });

            } else {
                const inputEl = document.getElementById('short-answer-input');
                userAnswer = inputEl.value.trim();
                if(!userAnswer) {
                    DOM.quizScreen.classList.remove('shake');
                    void DOM.quizScreen.offsetWidth;
                    DOM.quizScreen.classList.add('shake');
                    return;
                }
                inputEl.disabled = true;
                const normalizedUser = normalizeString(userAnswer);
                isCorrect = q.accepted.some(acc => normalizeString(acc) === normalizedUser);
                
                if(isCorrect) {
                    inputEl.classList.replace('border-slate-200', 'border-emerald-500');
                    inputEl.classList.replace('focus:border-indigo-500', 'focus:border-emerald-500');
                    inputEl.classList.add('bg-emerald-50', 'text-emerald-900', 'font-bold');
                } else {
                    inputEl.classList.replace('border-slate-200', 'border-rose-500');
                    inputEl.classList.add('bg-rose-50', 'text-rose-900', 'font-bold');
                }
            }

            isAnswerSubmitted = true;
            DOM.submitBtn.classList.add('hidden');
            DOM.nextBtn.parentElement.classList.remove('hidden');

            handleScoreAndStorage(q.id, isCorrect);
            showFeedback(isCorrect, q);
        }

        function handleScoreAndStorage(qId, isCorrect) {
            if (isCorrect) {
                score++;
                incorrectQuestions = incorrectQuestions.filter(id => id !== qId);
            } else {
                if(!incorrectQuestions.includes(qId)) {
                    incorrectQuestions.push(qId);
                }
            }
            localStorage.setItem('santaTrendsIncorrect', JSON.stringify(incorrectQuestions));
            updateIncorrectBadge();
        }

        function showFeedback(isCorrect, q) {
            DOM.feedbackCard.classList.remove('hidden');
            DOM.feedbackCard.classList.add('flex');
            
            if(isCorrect) {
                DOM.resultBanner.className = "p-5 rounded-xl font-bold text-lg flex items-center shadow-sm bg-emerald-50 text-emerald-700 border border-emerald-100";
                DOM.resultIcon.innerHTML = "🎉";
                DOM.resultMessage.innerHTML = `정답입니다! 공식 정답은 <span class="mx-1 px-2 py-0.5 bg-emerald-200/50 rounded">[ ${q.a} ]</span> 입니다.`;
            } else {
                DOM.resultBanner.className = "p-5 rounded-xl font-bold text-lg flex items-center shadow-sm bg-pink-50 text-pink-700 border border-pink-100";
                DOM.resultIcon.innerHTML = "💡";
                DOM.resultMessage.innerHTML = `아쉽습니다. 공식 정답은 <span class="mx-1 px-2 py-0.5 bg-pink-200/50 rounded">[ ${q.a} ]</span> 입니다.`;
            }

            DOM.explanationText.textContent = q.exp;
            DOM.essayTipText.textContent = q.tip;
            DOM.mnemonicText.textContent = q.m;
            
            setTimeout(() => {
                DOM.feedbackCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < activeQuestions.length) {
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                showResults();
            }
        }

        function showResults() {
            DOM.quizScreen.classList.add('hidden');
            DOM.resultScreen.classList.remove('hidden');
            
            document.getElementById('res-total').textContent = activeQuestions.length;
            document.getElementById('res-correct').textContent = score;
        }

        updateIncorrectBadge();
    </script>
</body>
</html>
